<meta charset="utf-8">
<title>Single-context callout shaders — 20 on a page</title>
<style>
  :root {
    --bg:#ffffff; --fg:#1f2328; --fg-dim:#59636e;
    --rule:rgba(31,35,40,.12); --panel:#f6f8fa;
    --font: ui-sans-serif, -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --fg:#e6edf3; --fg-dim:#9198a1; --rule:rgba(230,237,243,.14); --panel:#161b22; }
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--font);
    font-size:16px; line-height:1.7; -webkit-font-smoothing:antialiased; }
  #stage { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
  .doc { position:relative; z-index:1; max-width:760px; margin:0 auto; padding:56px 24px 120px; }
  h1 { font-size:30px; font-weight:600; letter-spacing:-.02em; margin:0 0 8px; }
  h2 { font-size:20px; font-weight:600; letter-spacing:-.01em; margin:52px 0 12px; }
  .lede { color:var(--fg-dim); font-size:17px; margin:0 0 8px; }
  p { margin:0 0 18px; }
  code { font-family:var(--mono); font-size:14px; background:var(--panel); padding:1px 6px; border-radius:5px; }
  .hud { position:fixed; right:16px; bottom:16px; z-index:3; background:var(--panel);
    border:1px solid var(--rule); border-radius:10px; padding:10px 12px; font-family:var(--mono);
    font-size:11.5px; line-height:1.7; color:var(--fg-dim); min-width:186px; }
  .hud b { color:var(--fg); font-weight:500; }
  .hud select { font:inherit; font-size:11.5px; margin-top:6px; width:100%; padding:3px;
    background:var(--bg); color:var(--fg); border:1px solid var(--rule); border-radius:6px; }
  .cal { position:relative; display:flex; gap:14px; padding:16px 18px; margin:26px 0;
    border-radius:10px; background:transparent;
    border:1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
  .ico { flex:0 0 24px; width:24px; height:24px; display:grid; place-items:center; color:var(--accent); margin-top:2px; }
  .ico svg { width:17px; height:17px; fill:currentColor; }
  .cal .body { min-width:0; }
  .cal .lbl { font-weight:600; font-size:14px; color:var(--accent); margin:0 0 3px; }
  .cal .body p { margin:0; font-size:14.5px; line-height:1.6; }
</style>

<canvas id="stage"></canvas>

<div class="hud">
  <div><b id="fps">–</b> fps &middot; <b id="drawn">0</b>/<b id="total">0</b> drawn</div>
  <div><b id="calls">0</b> draw calls &middot; <b id="ghosts">0</b> ghosts</div>
  <div>1 context &middot; 1 framebuffer</div>
  <div style="display:flex; align-items:center; gap:6px; margin-top:6px;">
    <span>Background</span>
    <input type="color" id="bgcol" value="#ffffff" style="flex:0 0 34px; height:22px; padding:0; border:1px solid var(--rule); border-radius:5px; background:none; cursor:pointer;">
    <button type="button" id="bgauto" style="font:inherit; font-size:11px; padding:3px 8px; border-radius:999px; border:1px solid var(--rule); background:var(--bg); color:var(--fg); cursor:pointer;">system</button>
  </div>
  <select id="quality">
    <option value="high">Quality: high</option>
    <option value="balanced" selected>Quality: balanced</option>
    <option value="battery">Quality: battery</option>
  </select>
</div>

<div class="doc" id="doc"></div>

<script>
const TRAIL = 12, BLOBS = 5;

const CFG = {
  container: false, icon: false, stroke: false,
  droplet: true, wholeCard: true, blobs: true,
  ambient: 1.00, refraction: 45, ior: 2.50,
  sheenSpeed: 0.10, lightAngle: 180, lightColor: '#526d37',
  textGhost: true, ghostOpacity: 0.07, ghostScale: 0.94, ghostBlur: 2,
  size: 21, blend: 9, goo: 4.2, dispersion: 1,
  shine: 0.3, rim: 0.55, iridescence: 1.0, intensity: 0.9, thickness: 0.15,
  cornerN: 2.9, edgeRoll: 1.0,
};

const QUALITY = {
  high:     { steps: 16, idleFps: 48, dpr: 2 },
  balanced: { steps: 12, idleFps: 30, dpr: 1.75 },
  battery:  { steps: 8,  idleFps: 12, dpr: 1.25 },
};

const KINDS = [
  { name: 'Note', accent: '#1f6feb', d: 'M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8Zm8-6.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13ZM6.5 7.75A.75.75 0 0 1 7.25 7h1a.75.75 0 0 1 .75.75v2.75h.25a.75.75 0 0 1 0 1.5h-2a.75.75 0 0 1 0-1.5h.25v-2h-.25a.75.75 0 0 1-.75-.75ZM8 6a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z' },
  { name: 'Tip', accent: '#238636', d: 'M8 1.5c-2.363 0-4 1.69-4 3.75 0 .984.424 1.625.984 2.304l.214.253c.223.264.47.556.673.848.284.411.537.896.621 1.49a.75.75 0 0 1-1.484.211c-.04-.282-.163-.547-.37-.847a8.456 8.456 0 0 0-.542-.68c-.084-.1-.173-.205-.268-.32C3.201 7.75 2.5 6.766 2.5 5.25 2.5 2.31 4.863 0 8 0s5.5 2.31 5.5 5.25c0 1.516-.701 2.5-1.328 3.259-.095.115-.184.22-.268.319-.207.245-.383.453-.541.681-.208.3-.33.565-.37.847a.751.751 0 0 1-1.485-.212c.084-.593.337-1.078.621-1.489.203-.292.45-.584.673-.848.075-.088.147-.173.213-.253.561-.679.985-1.32.985-2.304 0-2.06-1.637-3.75-4-3.75ZM5.75 12h4.5a.75.75 0 0 1 0 1.5h-4.5a.75.75 0 0 1 0-1.5ZM6 15.25a.75.75 0 0 1 .75-.75h2.5a.75.75 0 0 1 0 1.5h-2.5a.75.75 0 0 1-.75-.75Z' },
  { name: 'Important', accent: '#8957e5', d: 'M0 1.75C0 .784.784 0 1.75 0h12.5C15.216 0 16 .784 16 1.75v9.5A1.75 1.75 0 0 1 14.25 13H8.06l-2.573 2.573A1.458 1.458 0 0 1 3 14.543V13H1.75A1.75 1.75 0 0 1 0 11.25Zm9 3a1 1 0 1 0-2 0 1 1 0 0 0 2 0ZM7.25 6.5a.75.75 0 0 0 0 1.5h.25v2.25a.75.75 0 0 0 1.5 0V7.25a.75.75 0 0 0-.75-.75Z' },
  { name: 'Warning', accent: '#d29922', d: 'M6.457 1.047c.659-1.234 2.427-1.234 3.086 0l6.082 11.378A1.75 1.75 0 0 1 14.082 15H1.918a1.75 1.75 0 0 1-1.543-2.575Zm1.763.707a.25.25 0 0 0-.44 0L1.698 13.132a.25.25 0 0 0 .22.368h12.164a.25.25 0 0 0 .22-.368Zm.53 3.996v2.5a.75.75 0 0 1-1.5 0v-2.5a.75.75 0 0 1 1.5 0ZM9 11a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z' },
  { name: 'Caution', accent: '#da3633', d: 'M4.47.22A.749.749 0 0 1 5 0h6c.199 0 .389.079.53.22l4.25 4.25c.141.14.22.331.22.53v6a.749.749 0 0 1-.22.53l-4.25 4.25A.749.749 0 0 1 11 16H5a.749.749 0 0 1-.53-.22L.22 11.53A.749.749 0 0 1 0 11V5c0-.199.079-.389.22-.53Zm.84 1.28L1.5 5.31v5.38l3.81 3.81h5.38l3.81-3.81V5.31L10.69 1.5ZM8 4a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 8 4Zm0 8a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z' },
];

const SECTIONS = [
  { h: 'Overview', p: [
      'The renderer walks the scene graph once per frame and emits a flat command list. Nothing in the traversal allocates, so a steady scene produces no garbage between frames.',
      'Commands are sorted by pipeline state before submission. Sorting is stable, so draw order within a bucket follows scene order and remains predictable across frames.'],
    c: [[0, 'Traversal order is depth-first and stable. Two objects added in the same frame keep their relative order for the lifetime of the scene.'],
        [1, 'If you need a specific draw order for transparency, set an explicit sort key rather than relying on insertion order.']] },
  { h: 'Resource lifetime', p: [
      'Buffers and textures are reference counted against the command list rather than the scene graph. A resource stays alive while any in-flight frame still references it.',
      'Disposal is deferred to a fence signalled two frames later. Calling dispose during traversal is safe and does not stall.'],
    c: [[3, 'Disposing a resource still bound to an active pipeline does not error, but the memory is not reclaimed until the fence clears.'],
        [2, 'Reference counts are visible through the inspector. A count that never returns to zero is almost always a retained closure.'],
        [4, 'Never dispose a resource from inside a frame callback that may itself be re-entered. The fence will be signalled against a list that no longer exists.']] },
  { h: 'Pipelines', p: [
      'A pipeline is compiled the first time a material and geometry pair is seen, then cached against a key derived from both. Cache misses are logged in development builds.',
      'Compilation happens off the main thread where the platform supports it, falling back to a blocking compile with a warning otherwise.'],
    c: [[1, 'Warm the cache during a loading screen by drawing each material once to a scratch target. It costs a frame and removes the first-use hitch.'],
        [0, 'The cache key includes vertex attribute layout, so the same material against two different geometries compiles twice.'],
        [3, 'Mutating a material after first draw invalidates its cache entry and forces recompilation on the next frame.']] },
  { h: 'Frame pacing', p: [
      'The loop targets the display refresh rate through the platform vsync callback. It does not attempt to interpolate between fixed timesteps.',
      'Delta time is clamped so a backgrounded tab returning to focus cannot produce a single enormous step through physics.'],
    c: [[2, 'The clamp defaults to 50ms. Simulations that need a true fixed step should accumulate and sub-step themselves.'],
        [0, 'Frame callbacks receive both raw and clamped delta so you can choose which is appropriate.'],
        [4, 'Do not run physics on raw delta. A tab restored after an hour will step once with an hour of accumulated time.']] },
  { h: 'Instancing', p: [
      'Objects sharing a pipeline and geometry are merged into an instanced draw automatically when the count crosses a threshold. Per-instance data is packed into a storage buffer rebuilt only when membership changes.',
      'Instances retain individual transforms and can still be picked, since the picking pass writes an instance index alongside depth.'],
    c: [[1, 'Batching is worth forcing below the threshold when instances change rarely. Set the hint explicitly rather than adding placeholder objects.'],
        [0, 'The threshold is eight by default and configurable per material.'],
        [3, 'Adding or removing a single instance rebuilds the whole buffer. Prefer toggling visibility over removal for objects that come and go.']] },
  { h: 'Picking', p: [
      'Picking renders instance and object identifiers to a small offscreen target scaled to a fraction of the main framebuffer. Reads are asynchronous and resolve on the following frame.',
      'The target is only allocated when a picking query is first issued, so scenes that never pick pay nothing.'],
    c: [[2, 'A picking result is always one frame stale. For drag interactions, pick once on press and track the delta yourself.'],
        [4, 'Do not issue a synchronous read of the picking target. It stalls the pipeline and can cost tens of milliseconds.'],
        [1, 'Scale the picking target down aggressively. Quarter resolution is usually indistinguishable for cursor-sized targets.']] },
  { h: 'Diagnostics', p: [
      'Every frame records timings for traversal, sort, compile, and submit. The inspector shows a rolling window and flags any phase that exceeds its budget.',
      'Counters are cheap enough to leave enabled in production, though the inspector UI itself is stripped from release builds.'],
    c: [[0, 'Timings are wall clock on the CPU side. GPU timings require the timestamp query extension and appear separately when available.'],
        [3, 'A sort phase growing over time usually means the command list is not being reset. Check for a retained reference to a previous frame.'],
        [4, 'Leaving GPU timestamp queries enabled on a release build can serialise the pipeline on some drivers. Gate them behind an explicit flag.']] },
];

const doc = document.getElementById('doc');
doc.innerHTML = '<h1>Renderer internals</h1><p class="lede">How traversal, resources, and submission fit together.</p>';

let index = 0;
const cards = [];
for (const s of SECTIONS) {
  doc.insertAdjacentHTML('beforeend', `<h2>${s.h}</h2>`);
  s.p.forEach((text, i) => {
    doc.insertAdjacentHTML('beforeend', `<p>${text}</p>`);
    const pick = s.c[i];
    if (!pick) return;
    const k = KINDS[pick[0]];
    doc.insertAdjacentHTML('beforeend',
      `<div class="cal" data-v="${pick[0]}" style="--accent:${k.accent}">
        <span class="ico"><svg viewBox="0 0 16 16"><path d="${k.d}"/></svg></span>
        <div class="body"><p class="lbl">${k.name}</p><p>${pick[1]}</p></div>
      </div>`);
    index++;
  });
  for (let i = s.p.length; i < s.c.length; i++) {
    const pick = s.c[i];
    const k = KINDS[pick[0]];
    doc.insertAdjacentHTML('beforeend',
      `<div class="cal" data-v="${pick[0]}" style="--accent:${k.accent}">
        <span class="ico"><svg viewBox="0 0 16 16"><path d="${k.d}"/></svg></span>
        <div class="body"><p class="lbl">${k.name}</p><p>${pick[1]}</p></div>
      </div>`);
    index++;
  }
}

const FRAG = `
precision highp float;
uniform vec2 uView;
uniform float uDpr;
uniform vec4 uRect;
uniform float uTime;
uniform int uVariant;
uniform vec3 uColor;
uniform vec3 uBg;
uniform vec3 uToggle;
uniform float uDark;
uniform vec2 uIcon;
uniform float uIconR;
uniform float uRadius;
uniform float uStroke;
uniform sampler2D uGhost;
uniform float uGhostOn;
uniform float uGhostOpacity;
uniform float uGhostScale;
uniform float uGhostBlur;
uniform vec2 uTrail[${TRAIL}];
uniform int uCount;
uniform float uBaseRadius;
uniform float uBlend;
uniform vec2 uBlob[${BLOBS}];
uniform float uBlobR[${BLOBS}];
uniform int uBlobCount;
uniform float uGoo;
uniform float uWhole;
uniform float uThick;
uniform float uCornerN;
uniform float uEdgeRoll;
uniform float uRefraction;
uniform float uIOR;
uniform float uDispersion;
uniform float uShine;
uniform float uRim;
uniform float uIridescence;
uniform float uIntensity;
uniform vec3 uSheenA;
uniform vec3 uSheenB;
uniform float uSheenTime;
uniform vec3 uLight;
uniform vec3 uLightColor;
uniform int uSteps;

vec2 uSize;

mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }

float hash21(vec2 p){
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash21(i), hash21(i + vec2(1,0)), f.x),
             mix(hash21(i + vec2(0,1)), hash21(i + vec2(1,1)), f.x), f.y);
}

float fbm(vec2 p){
  float s = 0.0, a = 0.5;
  for(int i = 0; i < 5; i++){ s += a * vnoise(p); p *= 2.03; a *= 0.5; }
  return s;
}

float sdRoundBox(vec2 p, vec2 b, float r){
  vec2 q = abs(p) - b + r;
  return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
}

float sdSquircle(vec2 p, vec2 b, float r, float n){
  vec2 q = abs(p) - b + r;
  vec2 m = max(q, 0.0);
  float outside = pow(pow(m.x, n) + pow(m.y, n), 1.0 / n);
  return min(max(q.x, q.y), 0.0) + outside - r;
}

float sdSlab(vec3 p, vec2 b, float thick, float r, float n, float roll){
  float rz = clamp(roll, 0.02, 1.0) * thick;
  float d2 = sdSquircle(p.xy, b, r, n);
  vec2 w = vec2(d2 + rz, abs(p.z) - (thick - rz));
  return min(max(w.x, w.y), 0.0) + length(max(w, 0.0)) - rz;
}

vec4 ghostSample(vec2 q){
  vec2 texel = 1.0 / uSize;
  if(uGhostBlur < 0.01) return texture2D(uGhost, q * texel);
  vec4 acc = texture2D(uGhost, q * texel) * 0.28;
  for(int i = 0; i < 8; i++){
    float a = float(i) * 0.78539816;
    acc += texture2D(uGhost, (q + vec2(cos(a), sin(a)) * uGhostBlur) * texel) * 0.09;
  }
  return acc;
}

float containerPattern(vec2 p, float t){
  vec2 uv = p / uSize.y;
  if(uVariant == 0){
    return clamp(0.45 + 0.28 * sin(uv.x * 1.7 + t * 0.13) * cos(uv.y * 2.3 - t * 0.09)
      + 0.18 * sin(uv.x * 0.6 - uv.y * 1.1 + t * 0.07), 0.0, 1.0);
  }
  if(uVariant == 1){
    vec2 q = uv * 7.0;
    float acc = 0.0;
    for(int i = 0; i < 5; i++){
      float fi = float(i);
      q += vec2(sin(q.y * 1.3 + t * 0.35 + fi), cos(q.x * 1.15 - t * 0.28 + fi));
      acc += 0.55 / max(length(q * 0.42), 0.35);
    }
    return clamp(pow(acc * 0.16, 1.6) - 0.05, 0.0, 1.0);
  }
  if(uVariant == 2){
    float r = length(p - uIcon) / uSize.y;
    return (0.5 + 0.5 * sin(r * 44.0 - t * 0.9)) * exp(-r * 1.5);
  }
  if(uVariant == 3){
    return clamp(0.5 + 0.55 * sin((rot(0.14) * p).x * 0.92 + t * 0.10)
      * sin((rot(-0.10) * p).x * 0.97 - t * 0.13), 0.0, 1.0);
  }
  float n = fbm(uv * 5.5 + vec2(t * 0.11, -t * 0.07));
  return clamp(smoothstep(0.32, 0.78, n) * (0.6 + 0.4 * (0.5 + 0.5 * sin(uv.x * 5.0 - t * 0.6 + n * 3.0))), 0.0, 1.0);
}

float strokePattern(vec2 p, float t){
  if(uVariant == 0) return 1.0;
  if(uVariant == 1) return 0.35 + 0.65 * (p.x / uSize.x);
  if(uVariant == 2) return 0.45 + 0.55 * (0.5 + 0.5 * sin(length(p - uIcon) * 0.05 * 6.0 - t * 1.4));
  if(uVariant == 3) return smoothstep(-0.15, 0.35, sin((p.x + p.y) * 0.34 - t * 0.9)) * 0.9 + 0.1;
  return clamp(0.35 + 0.75 * vnoise(vec2((p.x + p.y) * 0.09, t * 0.8))
    + 0.25 * hash21(floor(vec2((p.x + p.y) * 0.13, t * 2.0))), 0.0, 1.2);
}

float iconPattern(vec2 p, float t){
  vec2 d = p - uIcon;
  float r = length(d);
  if(uVariant == 0) return 0.55 + 0.45 * (1.0 - smoothstep(0.0, uIconR, r));
  if(uVariant == 1) return exp(-r / uIconR * 1.9) * (0.75 + 0.25 * sin(t * 1.2));
  if(uVariant == 2) return 0.35 + 0.75 * (0.5 + 0.5 * dot(normalize(d + 0.0001), vec2(0.68, -0.73)));
  if(uVariant == 3) return 0.25 + 0.9 * (1.0 - smoothstep(0.45, 1.25, length(mod(d, 3.6) - 1.8)));
  return 0.3 + 0.85 * (0.5 + 0.5 * sin(r * 1.7 - t * 3.2)) * (1.0 - smoothstep(0.0, uIconR * 1.15, r));
}

vec4 card(vec2 p, float t){
  vec2 hs = uSize * 0.5;
  float d = sdRoundBox(p - hs, hs, uRadius);
  float inside = 1.0 - smoothstep(0.0, 1.2, d);
  if(inside <= 0.001) return vec4(0.0);

  vec3 base = mix(uBg, uColor, mix(0.05, 0.09, uDark));
  vec3 tint = mix(uColor, vec3(1.0), uDark * 0.25);
  vec3 col = base;

  if(uToggle.x > 0.5) col = mix(col, tint, clamp(containerPattern(p, t) * mix(0.15, 0.26, uDark), 0.0, 1.0));
  if(uToggle.z > 0.5){
    float band = abs(d + uStroke * 0.5) - uStroke * 0.5;
    col = mix(col, tint, clamp(clamp(strokePattern(p, t), 0.0, 1.6) * mix(0.55, 0.72, uDark)
      * (1.0 - smoothstep(0.0, 1.2, band)), 0.0, 1.0));
  }
  if(uToggle.y > 0.5){
    col = mix(col, tint, clamp(clamp(iconPattern(p, t), 0.0, 1.4) * mix(0.30, 0.42, uDark)
      * (1.0 - smoothstep(-1.0, 1.0, length(p - uIcon) - uIconR)), 0.0, 1.0));
  }
  if(uGhostOn > 0.5){
    vec2 mid = uSize * 0.5;
    vec4 g = ghostSample(mid + (p - mid) / max(uGhostScale, 0.05));
    col = col * (1.0 - g.a * uGhostOpacity) + g.rgb * uGhostOpacity;
  }
  return vec4(col, inside);
}

float rnd3(vec3 p){ return fract(sin(dot(p, vec3(12.9898, 78.233, 37.719))) * 43758.5453123); }

float noise3(vec3 p){
  vec3 i = floor(p), f = fract(p);
  vec3 u = f * f * (3.0 - 2.0 * f);
  float a = mix(mix(rnd3(i), rnd3(i + vec3(1,0,0)), u.x), mix(rnd3(i + vec3(0,1,0)), rnd3(i + vec3(1,1,0)), u.x), u.y);
  float b = mix(mix(rnd3(i + vec3(0,0,1)), rnd3(i + vec3(1,0,1)), u.x), mix(rnd3(i + vec3(0,1,1)), rnd3(i + vec3(1,1,1)), u.x), u.y);
  return mix(a, b, u.z);
}

float smin(float a, float b, float k){
  return -log(max(exp(-k * a) + exp(-k * b), 1e-12)) / k;
}

float mapD(vec3 p){
  float d = 4.0;
  for(int i = 0; i < ${TRAIL}; i++){
    if(i >= uCount) break;
    d = smin(d, length(p - vec3(uTrail[i], 0.0)) - (uBaseRadius * float(uCount) - uBaseRadius * float(i)), uBlend);
  }
  for(int i = 0; i < ${BLOBS}; i++){
    if(i >= uBlobCount) break;
    d = smin(d, length(p - vec3(uBlob[i], 0.0)) - uBlobR[i], uGoo);
  }
  if(uWhole > 0.5){
    float hw = uSize.x / uSize.y * 0.5;
    d = smin(d, sdSlab(p - vec3(hw, 0.5, 0.0), vec2(hw, 0.5), uThick, uRadius / uSize.y, uCornerN, uEdgeRoll), uGoo);
  }
  return d;
}

vec3 normalD(vec3 p){
  float e = 0.0015;
  return normalize(vec3(
    mapD(p + vec3(e,0,0)) - mapD(p - vec3(e,0,0)),
    mapD(p + vec3(0,e,0)) - mapD(p - vec3(0,e,0)),
    mapD(p + vec3(0,0,e)) - mapD(p - vec3(0,0,e))));
}

void main(){
  uSize = uRect.zw;
  vec2 css = gl_FragCoord.xy / uDpr;
  vec2 p = vec2(css.x - uRect.x, (uView.y - css.y) - uRect.y);

  vec4 baseCol = card(p, uTime);
  if(baseCol.a <= 0.001){ gl_FragColor = vec4(0.0); return; }

  vec3 ray = vec3(p / uSize.y, 1.0);
  vec3 dir = vec3(0.0, 0.0, -1.0);
  float dist = 0.0;
  for(int i = 0; i < 16; i++){
    if(i >= uSteps) break;
    dist = mapD(ray);
    ray += dir * dist;
    if(dist < 0.0008 || dist > 4.0) break;
  }

  float cov = 1.0 - smoothstep(0.0, 3.0 / uSize.y, dist);
  if(cov <= 0.002){
    gl_FragColor = vec4(baseCol.rgb * baseCol.a, baseCol.a);
    return;
  }

  vec3 n = normalD(ray);
  vec3 refl = reflect(dir, n);
  vec3 glints = pow(max((uSheenA * noise3(refl * 2.0 + uSheenTime)
    + uSheenB * noise3(refl * 2.0 - uSheenTime)) * uIntensity, 0.0), vec3(7.0));
  float spec = pow(max(dot(reflect(-uLight, n), vec3(0.0, 0.0, 1.0)), 0.0), 60.0);
  float edge = pow(1.0 - clamp(n.z, 0.0, 1.0), 1.5);

  vec3 col;
  if(uRefraction > 0.5){
    float ior = max(uIOR, 1.0);
    float ca = uDispersion * 0.03 * (ior - 1.0) / 0.33;
    vec3 rR = refract(dir, n, 1.0 / max(ior - ca, 1.0));
    vec3 rG = refract(dir, n, 1.0 / ior);
    vec3 rB = refract(dir, n, 1.0 / (ior + ca));
    vec2 oR = rR.xy * (uRefraction / max(abs(rR.z), 0.35));
    vec2 oG = rG.xy * (uRefraction / max(abs(rG.z), 0.35));
    vec2 oB = rB.xy * (uRefraction / max(abs(rB.z), 0.35));
    vec2 lo = vec2(1.0), hi = uSize - vec2(1.0);
    col = vec3(card(clamp(p + oR, lo, hi), uTime).r,
               card(clamp(p + oG, lo, hi), uTime).g,
               card(clamp(p + oB, lo, hi), uTime).b);
    col *= 1.0 - 0.35 * uRim * edge;
  } else {
    col = baseCol.rgb * (1.0 - 0.3 * uRim * edge);
  }

  float calm = mix(1.0, 0.5, uWhole);
  col += glints * uIridescence * calm;
  col += uLightColor * (spec * uShine * calm);

  vec3 outCol = mix(baseCol.rgb, col, cov);
  gl_FragColor = vec4(outCol * baseCol.a, baseCol.a);
}
`;

const VERT = `
attribute vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }
`;

const canvas = document.getElementById('stage');
const gl = canvas.getContext('webgl', { alpha: true, antialias: false, premultipliedAlpha: true });

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const U = new Proxy({}, { get: (c, k) => (k in c ? c[k] : (c[k] = gl.getUniformLocation(prog, k))) });

const hexToRgb = (h) => {
  const n = parseInt(h.replace('#', ''), 16);
  return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
};
const LIGHT_RGB = hexToRgb(CFG.lightColor);

function seeded(n) {
  let x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return () => { x = Math.sin(x * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
}

const BLOB_SCALE = [1.2, 0.62, 0.95, 0.48, 0.78];

function rasterizeGhost(el, cv, dprCap) {
  const dpr = Math.min(window.devicePixelRatio || 1, dprCap);
  const w = Math.max(1, el.offsetWidth), h = Math.max(1, el.offsetHeight);
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  const g = cv.getContext('2d');
  if (!g) return;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  const icon = el.querySelector('.ico');
  const path = icon && icon.querySelector('path');
  if (path) {
    const side = 17, k = side / 16;
    g.save();
    g.translate(icon.offsetLeft + (icon.offsetWidth - side) / 2, icon.offsetTop + (icon.offsetHeight - side) / 2);
    g.scale(k, k);
    g.fillStyle = getComputedStyle(icon).color;
    try { g.fill(new Path2D(path.getAttribute('d'))); } catch {}
    g.restore();
  }
  const calRect = el.getBoundingClientRect();
  el.querySelectorAll('.body p').forEach((node) => {
    const cs = getComputedStyle(node);
    const size = parseFloat(cs.fontSize);
    g.font = `${cs.fontStyle} ${cs.fontWeight} ${size}px ${cs.fontFamily}`;
    g.fillStyle = cs.color;
    g.textBaseline = 'alphabetic';

    const probe = g.measureText('Mg');
    const ascent = probe.fontBoundingBoxAscent || probe.actualBoundingBoxAscent || size * 0.8;
    const descent = probe.fontBoundingBoxDescent || probe.actualBoundingBoxDescent || size * 0.2;
    const fontH = ascent + descent;

    const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
    const range = document.createRange();
    let textNode, drew = 0;
    while ((textNode = walker.nextNode())) {
      const str = textNode.nodeValue || '';
      const re = /\S+/g;
      let m;
      while ((m = re.exec(str))) {
        range.setStart(textNode, m.index);
        range.setEnd(textNode, m.index + m[0].length);
        const r = range.getBoundingClientRect();
        if (!r.width) continue;
        const baseline = r.top - calRect.top + (r.height - fontH) / 2 + ascent;
        g.fillText(m[0], r.left - calRect.left, baseline);
        drew++;
      }
    }
    if (!drew) g.fillText(node.textContent || '', node.offsetLeft, node.offsetTop + size);
  });
}

const GHOST_CAP = 8;
const ghostCache = new Map();

function ghostFor(cell, dprCap) {
  const hit = ghostCache.get(cell.el);
  if (hit) { hit.stamp = frameId; return hit.tex; }
  if (ghostCache.size >= GHOST_CAP) {
    let oldest = null;
    for (const [k, v] of ghostCache) if (!oldest || v.stamp < oldest[1].stamp) oldest = [k, v];
    if (oldest) { gl.deleteTexture(oldest[1].tex); ghostCache.delete(oldest[0]); }
  }
  const cv = document.createElement('canvas');
  rasterizeGhost(cell.el, cv, dprCap);
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  ghostCache.set(cell.el, { tex, stamp: frameId });
  return tex;
}

document.querySelectorAll('.cal').forEach((el, i) => {
  const rnd = seeded(i + 1);
  cards.push({
    el, i,
    variant: parseInt(el.dataset.v, 10),
    rgb: hexToRgb(KINDS[parseInt(el.dataset.v, 10)].accent),
    blobs: BLOB_SCALE.map((f) => ({
      f, cx: 0.14 + rnd() * 0.72, cy: 0.28 + rnd() * 0.44,
      ax: 0.06 + rnd() * 0.13, ay: 0.10 + rnd() * 0.16,
      fx: 0.09 + rnd() * 0.13, fy: 0.07 + rnd() * 0.14,
      px: rnd() * 6.283, py: rnd() * 6.283,
    })),
    tx: new Float32Array(TRAIL), ty: new Float32Array(TRAIL),
    hx: 0, hy: 0, target: null, settled: true, primed: false,
  });
});

document.getElementById('total').textContent = cards.length;

const packedTrail = new Float32Array(TRAIL * 2);
const packedBlob = new Float32Array(BLOBS * 2);
const packedBlobR = new Float32Array(BLOBS);
const lightVec = (() => {
  const a = (CFG.lightAngle * Math.PI) / 180;
  const v = [Math.sin(a), -Math.cos(a), 0.6];
  const l = Math.hypot(v[0], v[1], v[2]);
  return new Float32Array([v[0] / l, v[1] / l, v[2] / l]);
})();

const toggles = new Float32Array([CFG.container ? 1 : 0, CFG.icon ? 1 : 0, CFG.stroke ? 1 : 0]);

function pageBg() {
  const c = getComputedStyle(document.body).backgroundColor.match(/[\d.]+/g);
  return c ? [c[0] / 255, c[1] / 255, c[2] / 255] : [1, 1, 1];
}

const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
const darkMq = window.matchMedia('(prefers-color-scheme: dark)');
const bgcol = document.getElementById('bgcol');

function lumOf(hex) {
  const n = parseInt(hex.slice(1), 16);
  const f = (c) => (c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  return 0.2126 * f(((n >> 16) & 255) / 255) + 0.7152 * f(((n >> 8) & 255) / 255) + 0.0722 * f((n & 255) / 255);
}

function isDarkBg() { return lumOf(bgcol.value) < 0.4; }

function applyBg() {
  const dark = isDarkBg();
  const r = document.documentElement.style;
  r.setProperty('--bg', bgcol.value);
  r.setProperty('--fg', dark ? '#e6edf3' : '#1f2328');
  r.setProperty('--fg-dim', dark ? '#9198a1' : '#59636e');
  r.setProperty('--rule', dark ? 'rgba(230,237,243,.16)' : 'rgba(31,35,40,.12)');
  r.setProperty('--panel', dark ? 'rgba(255,255,255,.06)' : 'rgba(0,0,0,.04)');
  for (const [, v] of ghostCache) gl.deleteTexture(v.tex);
  ghostCache.clear();
  dirty = true;
}

function systemBg() { return darkMq.matches ? '#0d1117' : '#ffffff'; }

bgcol.addEventListener('input', applyBg);
document.getElementById('bgauto').addEventListener('click', () => { bgcol.value = systemBg(); applyBg(); });

const qualitySel = document.getElementById('quality');
let Q = QUALITY[qualitySel.value];

let viewW = 0, viewH = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, Q.dpr);
  viewW = window.innerWidth;
  viewH = window.innerHeight;
  canvas.width = Math.round(viewW * dpr);
  canvas.height = Math.round(viewH * dpr);
  for (const [, v] of ghostCache) gl.deleteTexture(v.tex);
  ghostCache.clear();
}
window.addEventListener('resize', () => { resize(); dirty = true; });

for (const c of cards) {
  c.el.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'touch' || reduced.matches) return;
    const r = c.el.getBoundingClientRect();
    const m = CFG.size * 0.5;
    c.target = [
      Math.max(m, Math.min(r.width - m, e.clientX - r.left)),
      Math.max(m, Math.min(r.height - m, e.clientY - r.top)),
    ];
    c.settled = false;
  }, { passive: true });
  c.el.addEventListener('pointerleave', () => { c.target = null; c.settled = false; }, { passive: true });
}

let frameId = 0, blobClock = Math.PI, sheenClock = 0, prev = performance.now();
let dirty = true, fpsAcc = 0, fpsFrames = 0, fpsLast = performance.now();

qualitySel.addEventListener('change', () => { Q = QUALITY[qualitySel.value]; resize(); dirty = true; });
darkMq.addEventListener('change', () => { for (const [, v] of ghostCache) gl.deleteTexture(v.tex); ghostCache.clear(); dirty = true; });

bgcol.value = systemBg();
applyBg();
resize();

function frame(now) {
  requestAnimationFrame(frame);

  const busy = cards.some((c) => !c.settled);
  const cap = busy ? 60 : Q.idleFps;
  if (!dirty && now - prev < 1000 / cap - 1.5) return;

  const dt = Math.min((now - prev) / 1000, 0.25);
  prev = now;
  dirty = false;
  frameId++;

  const live = CFG.blobs && !reduced.matches;
  if (live) blobClock += dt * CFG.ambient;
  if (!reduced.matches) sheenClock += dt * CFG.sheenSpeed;

  const bg = pageBg();
  const dark = isDarkBg() ? 1 : 0;

  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.disable(gl.SCISSOR_TEST);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.SCISSOR_TEST);

  gl.uniform2f(U.uView, viewW, viewH);
  gl.uniform1f(U.uDpr, dpr);
  gl.uniform1f(U.uTime, 0);
  gl.uniform3fv(U.uToggle, toggles);
  gl.uniform1f(U.uDark, dark);
  gl.uniform3fv(U.uBg, bg);
  gl.uniform1f(U.uIconR, 15);
  gl.uniform1f(U.uRadius, 10);
  gl.uniform1f(U.uStroke, 1.6);
  gl.uniform1f(U.uGhostOn, CFG.textGhost ? 1 : 0);
  gl.uniform1f(U.uGhostOpacity, CFG.ghostOpacity);
  gl.uniform1f(U.uGhostScale, CFG.ghostScale);
  gl.uniform1f(U.uGhostBlur, CFG.ghostBlur);
  gl.uniform1f(U.uBlend, CFG.blend);
  gl.uniform1f(U.uGoo, CFG.goo);
  gl.uniform1f(U.uWhole, CFG.wholeCard ? 1 : 0);
  gl.uniform1f(U.uThick, CFG.thickness);
  gl.uniform1f(U.uCornerN, CFG.cornerN);
  gl.uniform1f(U.uEdgeRoll, CFG.edgeRoll);
  gl.uniform1f(U.uRefraction, CFG.refraction);
  gl.uniform1f(U.uIOR, CFG.ior);
  gl.uniform1f(U.uDispersion, CFG.dispersion);
  gl.uniform1f(U.uShine, CFG.shine);
  gl.uniform1f(U.uRim, CFG.rim);
  gl.uniform1f(U.uIridescence, CFG.iridescence);
  gl.uniform1f(U.uIntensity, CFG.intensity);
  gl.uniform1f(U.uSheenTime, sheenClock);
  gl.uniform3fv(U.uLight, lightVec);
  gl.uniform3fv(U.uLightColor, LIGHT_RGB);
  gl.uniform1i(U.uSteps, Q.steps);
  gl.uniform1i(U.uGhost, 0);

  let calls = 0, drawn = 0;

  for (const c of cards) {
    const r = c.el.getBoundingClientRect();
    if (r.bottom < -80 || r.top > viewH + 80 || r.width < 2) { c.primed = false; continue; }
    drawn++;

    const w = r.width, h = r.height;
    const icon = c.el.querySelector('.ico');
    const ix = icon.offsetLeft + icon.offsetWidth / 2;
    const iy = icon.offsetTop + icon.offsetHeight / 2;

    if (!c.primed) { c.hx = ix; c.hy = iy; c.tx.fill(ix); c.ty.fill(iy); c.primed = true; }

    const t = c.target || [ix, iy];
    const k = 1 - Math.exp(-dt * (c.target ? 17 : 9));
    c.hx += (t[0] - c.hx) * k;
    c.hy += (t[1] - c.hy) * k;
    for (let i = TRAIL - 1; i > 0; i--) { c.tx[i] = c.tx[i - 1]; c.ty[i] = c.ty[i - 1]; }
    c.tx[0] = c.hx; c.ty[0] = c.hy;

    let spread = 0;
    for (let i = 1; i < TRAIL; i++) {
      spread = Math.max(spread, Math.abs(c.tx[i] - c.tx[i - 1]) + Math.abs(c.ty[i] - c.ty[i - 1]));
    }
    c.settled = !c.target && spread < 0.4;
    const count = c.settled ? 1 : TRAIL;

    for (let i = 0; i < TRAIL; i++) { packedTrail[i * 2] = c.tx[i] / h; packedTrail[i * 2 + 1] = c.ty[i] / h; }
    for (let i = 0; i < BLOBS; i++) {
      const b = c.blobs[i];
      const rad = CFG.size * b.f;
      const mx = (rad + 3) / w, my = (rad + 3) / h;
      const bx = Math.min(1 - mx, Math.max(mx, b.cx + b.ax * Math.sin(blobClock * b.fx + b.px)));
      const by = Math.min(1 - my, Math.max(my, b.cy + b.ay * Math.sin(blobClock * b.fy + b.py)));
      packedBlob[i * 2] = (bx * w) / h;
      packedBlob[i * 2 + 1] = by;
      packedBlobR[i] = rad / h;
    }

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, ghostFor(c, Q.dpr));

    gl.uniform4f(U.uRect, r.left, r.top, w, h);
    gl.uniform1i(U.uVariant, c.variant);
    gl.uniform3fv(U.uColor, c.rgb);
    gl.uniform2f(U.uIcon, ix, iy);
    gl.uniform2fv(U.uTrail, packedTrail);
    gl.uniform1i(U.uCount, CFG.droplet ? count : 0);
    gl.uniform1f(U.uBaseRadius, (CFG.size / h) / count);
    gl.uniform2fv(U.uBlob, packedBlob);
    gl.uniform1fv(U.uBlobR, packedBlobR);
    gl.uniform1i(U.uBlobCount, live ? BLOBS : 0);
    gl.uniform3fv(U.uSheenA, c.rgb.map((v) => Math.min(1, v * 0.55 + 0.30)));
    gl.uniform3fv(U.uSheenB, [c.rgb[2] * 0.5 + 0.32, c.rgb[0] * 0.5 + 0.30, c.rgb[1] * 0.5 + 0.34]);

    const sx = Math.max(0, Math.floor(r.left * dpr));
    const sy = Math.max(0, Math.floor((viewH - r.bottom) * dpr));
    const sw = Math.min(canvas.width - sx, Math.ceil(w * dpr));
    const sh = Math.min(canvas.height - sy, Math.ceil(h * dpr));
    if (sw <= 0 || sh <= 0) continue;
    gl.scissor(sx, sy, sw, sh);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    calls++;
  }

  gl.disable(gl.SCISSOR_TEST);

  fpsFrames++;
  if (now - fpsLast > 500) {
    document.getElementById('fps').textContent = Math.round((fpsFrames * 1000) / (now - fpsLast));
    fpsFrames = 0; fpsLast = now;
  }
  document.getElementById('drawn').textContent = drawn;
  document.getElementById('calls').textContent = calls;
  document.getElementById('ghosts').textContent = ghostCache.size;
}

window.addEventListener('scroll', () => { dirty = true; }, { passive: true });
requestAnimationFrame(frame);
</script>
